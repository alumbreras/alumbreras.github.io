<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">

{% include head.html %}

<body>
    <div class="container" style="position:relative; margin-top: 60px;">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8">
                {% include navbar.html %}
                <article class="prose">
                    <p class="back-link"><a href="/writing.html">← Writing</a></p>
                    <h1>{{ page.title }}</h1>
                    <p class="writing-meta">
                        <span>{{ page.date | date: "%B %-d, %Y" }}</span>
                        {%- if page.topic %}<span>{{ page.topic }}</span>{% endif -%}
                    </p>
                    {{ content }}
                    <p class="back-link back-link-bottom"><a href="/writing.html">← Writing</a></p>
                </article>
            </div>
        </div>
    </div>

    <section id="footer">
        {% include footer.html %}
    </section>
    {% include scripts.html %}
</body>

</html>
