# github uses safe = true, but safe = false allows using the jekyll-scholar plugin in local machine
safe: false 
encoding: utf-8

# Build settings
markdown: kramdown
highlighter: rouge

kramdown:
  # use Github Flavored Markdown
  input: GFM
  auto_ids: true
  # do not replace newlines by <br>s
  hard_wrap: false

include: ['_pages']

# Outputting
exclude: [
  'cibuild',
  'Gemfile',
  'Gemfile.lock',
  'package.json',
  'README.md',
  'vendor',
  'drafts/',
  'talks/',
  '*.Rmd']

timezone: Europe/Berlin
baseurl: '' # the subpath of your site, e.g. /blog/
url: 'https://albertolumbreras.net' # the base hostname & protocol for your site
title: 'Alberto Lumbreras'
author: 'Alberto Lumbreras'
description: 'Research scientist in AI. Writing on AI, its social impact, and how I work with it.'

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  path: feed.xml


permalink: /posts/:title.html

collections:
  talks:
    output: true
    permalink: /talks/:title/
  ai_notes:
    output: true
    permalink: /ai-notes/:title/